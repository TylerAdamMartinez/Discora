[package]
name = "discora"
version = "0.1.6"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
dirs = "7"
inquire = { version = "0.9.4", features = ["fuzzy"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "std", "layout-cache"] }
ratatui-image = { version = "11.0.8", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
toml = "0.9"

[dev-dependencies]
serde_json = "1.0.154"

[target.'cfg(unix)'.dependencies]
reqwest = { version = "0.13.5", features = ["blocking", "json", "query"] }
nix = { version = "0.31.3", features = ["signal", "process", "fs"] }
signal-hook = "0.4.5"

[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "query", "native-tls", "http2", "charset", "system-proxy"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Console", "Win32_Storage_FileSystem"] }
